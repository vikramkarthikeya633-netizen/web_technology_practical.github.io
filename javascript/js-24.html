<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch Lap Timer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: #eef2ff;
            background:
                radial-gradient(circle at 15% 20%, rgba(99,102,241,.28), transparent 28%),
                radial-gradient(circle at 85% 10%, rgba(236,72,153,.22), transparent 30%),
                linear-gradient(135deg, #0b1020, #111827 55%, #1e1b4b);
        }
        .wrap { width: min(1100px, 92%); margin: auto; padding: 28px 0 50px; }
        header {
            padding: 28px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            background: rgba(255,255,255,.07);
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            margin-bottom: 22px;
        }
        h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 3rem); }
        h2 { margin-top: 0; }
        .desc { color: #cbd5e1; line-height: 1.7; }
        .demo {
            background: rgba(255,255,255,.96);
            color: #111827;
            border-radius: 20px;
            padding: 24px;
            min-height: 180px;
            box-shadow: 0 18px 50px rgba(0,0,0,.18);
        }
        nav { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
        nav a, button {
            display:inline-block;
            border:0;
            border-radius:12px;
            padding:11px 16px;
            text-decoration:none;
            color:white;
            background:linear-gradient(135deg,#6366f1,#ec4899);
            cursor:pointer;
            font-weight:700;
        }
        nav a.secondary { background:rgba(255,255,255,.12); }
        input, select, textarea {
            width:100%; padding:11px 12px; margin:6px 0 12px;
            border:1px solid #cbd5e1; border-radius:10px;
        }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
        .box { padding:18px; border-radius:16px; background:#f8fafc; border:1px solid #e2e8f0; }
        .tag { display:inline-block; padding:5px 9px; border-radius:999px; background:#ede9fe; color:#5b21b6; font-size:.82rem; }
        footer { text-align:center; color:#94a3b8; margin-top:25px; font-size:.9rem; }
        
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Stopwatch Lap Timer</h1>
        <p class="desc"><strong>Description:</strong> Record lap timestamps while a stopwatch runs.</p>
        <nav>
            <a href="../index.html">Home</a>
            <a class="secondary" href="index.html">Back to Programs</a>
        </nav>
    </header>
    <main class="demo">
        <h2 id="time">0.00 s</h2><button onclick="start()">Start</button> <button onclick="lap()">Lap</button> <button onclick="stop()">Stop</button> <button onclick="resetAll()">Reset</button><ol id="laps"></ol>
    </main>
    <footer>N. Vikram Karthikeya • 250200525 • Section 5 • Web Technology and Internet Programming</footer>
</div>
<script>let startTime=0,interval=null,elapsed=0;function start(){if(interval)return;startTime=Date.now()-elapsed;interval=setInterval(()=>{elapsed=Date.now()-startTime;time.textContent=(elapsed/1000).toFixed(2)+' s'},50)}function stop(){clearInterval(interval);interval=null}function lap(){if(elapsed)laps.innerHTML+='<li>'+ (elapsed/1000).toFixed(2)+' s</li>'}function resetAll(){stop();elapsed=0;time.textContent='0.00 s';laps.innerHTML=''}</script>
</body>
</html>
